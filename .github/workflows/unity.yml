name: Unity client

# The Unity client (unity/): the engine-free parts run on any runner; the Unity editor needs a licence.
# Not verified on a runner yet: the Unity jobs depend on a GameCI image for editor 6000.6.9f1 and on the repository secrets
# UNITY_LICENSE (a personal or professional licence file), UNITY_EMAIL and UNITY_PASSWORD. Without them those jobs are skipped.
# What was checked on a computer: the tests, the Windows build, the zip and the Inno Setup installer (scripts/build-unity-client.ps1).
on:
  push:
    branches: [main]
    paths: ['unity/**', 'shared/**', 'scripting/**', 'scripts/build-unity-client.ps1', 'installer/**', '.github/workflows/unity.yml']
  pull_request:
    paths: ['unity/**', 'shared/**', 'scripting/**', 'scripts/build-unity-client.ps1', 'installer/**', '.github/workflows/unity.yml']
  workflow_dispatch:

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-free:
    name: Wire protocol and island server core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/LifeVerse.Wire.Tests -c Release
      - run: dotnet test tests/LifeVerse.IslandServer.Tests -c Release

  unity:
    name: Unity tests and Windows build
    needs: engine-free
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Plugins (shared/ and scripting/ for Unity)
        shell: pwsh
        run: ./unity/UnityPlugins/build-plugins.ps1
      - uses: actions/cache@v4
        with:
          path: unity/UnityClient/Library
          key: unity-library-${{ hashFiles('unity/UnityClient/Packages/manifest.json', 'unity/UnityClient/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-
      - name: Unity edit mode tests
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: unity/UnityClient
          unityVersion: 6000.6.9f1
          testMode: EditMode
      - name: Windows build
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity/UnityClient
          unityVersion: 6000.6.9f1
          targetPlatform: StandaloneWindows64
          buildMethod: LifeVerse.Unity.EditorTools.BuildClient.BuildWindows
      - uses: actions/upload-artifact@v4
        if: env.UNITY_LICENSE != ''
        with:
          name: unity-windows-build
          path: unity/UnityClient/Builds/Windows

  package:
    name: Zip, checksums and installer
    needs: unity
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unity-windows-build
          path: unity/UnityClient/Builds/Windows
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Package
        shell: pwsh
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          ./scripts/build-unity-client.ps1 -SkipBuild -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: unity-client-package
          path: artifacts/unity-*
