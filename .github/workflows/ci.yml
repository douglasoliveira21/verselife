name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore LifeVerse.slnx
      - run: dotnet build LifeVerse.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/LifeVerse.Api.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/tests.trx"

  supervisor-image:
    name: Island supervisor image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # only the supervisor stage: the full image also downloads the Unity server package given in the build arguments
      - name: Build the supervisor stage the same way the host does
        run: docker build -f island-supervisor/Dockerfile.unity --target supervisor -t lifeverse-supervisor:ci .
